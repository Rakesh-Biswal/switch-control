<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Device Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .device-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .device-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .device-icon {
            font-size: 24px;
            color: #007bff;
            width: 50px;
            height: 50px;
            background: #e7f1ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device-info h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .device-info p {
            color: #666;
            font-size: 14px;
        }

        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #007bff;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .status {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .status.off {
            background: #ffebee;
            color: #dc3545;
        }

        .status.on {
            background: #e8f5e9;
            color: #28a745;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: #666;
            font-size: 14px;
            display: none;
        }

        .error {
            background: #ffebee;
            color: #dc3545;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
            font-size: 14px;
        }

        .connection-status {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .connection-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #28a745;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dual Device Controller</h1>
            <p>Control your Smart Extension Board and Water Pump</p>
        </div>

        <!-- Smart Extension Board Card -->
        <div class="device-card">
            <div class="device-header">
                <div class="device-icon">⚡</div>
                <div class="device-info">
                    <h3>Smart Extension Board</h3>
                    <p>Control power to multiple devices</p>
                </div>
            </div>
            <div class="switch-container">
                <div id="extensionStatus" class="status off">OFF</div>
                <label class="switch">
                    <input type="checkbox" id="extensionSwitch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Water Pump Card -->
        <div class="device-card">
            <div class="device-header">
                <div class="device-icon">💧</div>
                <div class="device-info">
                    <h3>Water Pump</h3>
                    <p>Control water flow remotely</p>
                </div>
            </div>
            <div class="switch-container">
                <div id="pumpStatus" class="status off">OFF</div>
                <label class="switch">
                    <input type="checkbox" id="pumpSwitch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div id="loadingMessage" class="loading">
            Updating device status...
        </div>

        <div id="errorMessage" class="error"></div>

        <div class="connection-status">
            <span class="connection-dot"></span>
            Connected to Firebase
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            databaseURL: "https://cloud-switch-6fa15-default-rtdb.firebaseio.com/"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Get DOM elements
        const extensionSwitch = document.getElementById('extensionSwitch');
        const pumpSwitch = document.getElementById('pumpSwitch');
        const extensionStatus = document.getElementById('extensionStatus');
        const pumpStatus = document.getElementById('pumpStatus');
        const loadingMessage = document.getElementById('loadingMessage');
        const errorMessage = document.getElementById('errorMessage');

        // Firebase references
        const extensionRef = database.ref('extensionBoard/status');
        const pumpRef = database.ref('waterPump/status');

        // Listen for Extension Board changes
        extensionRef.on('value', (snapshot) => {
            const status = snapshot.val();
            if (status !== null) {
                updateDeviceUI(extensionSwitch, extensionStatus, status === 1);
                hideError();
            }
        }, (error) => {
            showError('Error reading extension board status: ' + error.message);
        });

        // Listen for Water Pump changes
        pumpRef.on('value', (snapshot) => {
            const status = snapshot.val();
            if (status !== null) {
                updateDeviceUI(pumpSwitch, pumpStatus, status === 1);
                hideError();
            }
        }, (error) => {
            showError('Error reading water pump status: ' + error.message);
        });

        // Handle Extension Board toggle
        extensionSwitch.addEventListener('change', function() {
            const newStatus = this.checked ? 1 : 0;
            showLoading();
            
            extensionRef.set(newStatus)
                .then(() => {
                    console.log('Extension board updated to:', newStatus);
                    hideLoading();
                    hideError();
                })
                .catch((error) => {
                    console.error('Error updating extension:', error);
                    showError('Error updating extension board: ' + error.message);
                    hideLoading();
                    this.checked = !this.checked;
                    updateDeviceUI(this, extensionStatus, !this.checked);
                });
        });

        // Handle Water Pump toggle
        pumpSwitch.addEventListener('change', function() {
            const newStatus = this.checked ? 1 : 0;
            showLoading();
            
            pumpRef.set(newStatus)
                .then(() => {
                    console.log('Water pump updated to:', newStatus);
                    hideLoading();
                    hideError();
                })
                .catch((error) => {
                    console.error('Error updating pump:', error);
                    showError('Error updating water pump: ' + error.message);
                    hideLoading();
                    this.checked = !this.checked;
                    updateDeviceUI(this, pumpStatus, !this.checked);
                });
        });

        // Update UI for a device
        function updateDeviceUI(switchElement, statusElement, isOn) {
            switchElement.checked = isOn;
            
            if (isOn) {
                statusElement.textContent = 'ON';
                statusElement.className = 'status on';
            } else {
                statusElement.textContent = 'OFF';
                statusElement.className = 'status off';
            }
        }

        function showLoading() {
            loadingMessage.style.display = 'block';
        }

        function hideLoading() {
            loadingMessage.style.display = 'none';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Initialize devices on load
        showLoading();
        
        Promise.all([
            extensionRef.once('value'),
            pumpRef.once('value')
        ])
        .then(([extensionSnapshot, pumpSnapshot]) => {
            // Initialize Extension Board
            const extensionStatusVal = extensionSnapshot.val();
            if (extensionStatusVal !== null) {
                updateDeviceUI(extensionSwitch, extensionStatus, extensionStatusVal === 1);
            } else {
                extensionRef.set(0);
                updateDeviceUI(extensionSwitch, extensionStatus, false);
            }
            
            // Initialize Water Pump
            const pumpStatusVal = pumpSnapshot.val();
            if (pumpStatusVal !== null) {
                updateDeviceUI(pumpSwitch, pumpStatus, pumpStatusVal === 1);
            } else {
                pumpRef.set(0);
                updateDeviceUI(pumpSwitch, pumpStatus, false);
            }
            
            hideLoading();
        })
        .catch((error) => {
            console.error('Error initializing devices:', error);
            showError('Failed to load device status');
            hideLoading();
        });
    </script>
</body>
</html>
